server:
  port: 8765

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-auth
              uri: lb://USER-AUTH
              predicates:
                - Path=/api-gateway/user-auth/**
              filters:
                - RewritePath=/api-gateway/user-auth/(?<segment>.*), /${segment}

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api-gateway/user-service/**
              filters:
                - RewritePath=/api-gateway/user-service/(?<segment>.*), /${segment}

            # Swagger UI & OpenAPI docs from user-auth (through common prefix)
            - id: user-auth-swagger
              uri: lb://USER-AUTH
              predicates:
                - Path=/api-gateway/user-auth/swagger-ui.html

            - id: user-auth-api-docs
              uri: lb://USER-AUTH
              predicates:
                - Path=/api-gateway/user-auth/v3/api-docs

  security:
    user:
      name: admin
      password: admin

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
